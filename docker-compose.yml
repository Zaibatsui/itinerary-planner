# Itinerary Planner — build and run with: docker compose up -d --build
services:
  itinerary:
    build: .
    container_name: itinerary
    restart: unless-stopped
    ports:
      - "${PORT:-8095}:8080"
    environment:
      TZ: ${TZ:-Europe/London}
      BASE_URL: ${BASE_URL:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CARTO_KEY: ${CARTO_KEY:-}
      CONTACT: ${CONTACT:-}
    volumes:
      - itinerary-data:/data
volumes:
  itinerary-data:
