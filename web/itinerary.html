<title>Itinerary Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/vendor/leaflet.css">
<script src="/vendor/leaflet.js"></script>
<style>
/* Layout: floating glass shell on a soft daylight aurora — trip header bar, card sidebar, day×hour board in a rounded panel */
:root{
  --bg:#f5f6fb; --glow-a:#ffd8c8; --glow-b:#c6f1ea; --glow-c:#e4dcff;
  --surface:rgba(255,255,255,.82); --solid:#ffffff; --hover:rgba(20,22,41,.05);
  --line:#e3e6f0; --line2:#eef0f6; --fg:#141629; --muted:#646a85;
  --accent:#ff5a36; --accent-2:#ff9a3d; --accent-fg:#ffffff; --accent-soft:#ffece6; --now:#ff5a36; --danger:#e5383b; --ok:#0fa968; --ok-soft:#dcf7ea;
  --gcal-line:#7c8cff;
  --c-travel:#2b7bff; --c-stay:#8b5cf6; --c-food:#ff8a00; --c-activity:#10b981; --c-meeting:#ec4899; --c-other:#64748b;
  --shadow:0 1px 2px rgba(20,22,41,.06),0 8px 24px -6px rgba(20,22,41,.12);
  --shadow-lg:0 24px 60px -12px rgba(20,22,41,.28);
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --r:20px; --hour:52px; --gutter:58px; --colmin:128px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0e19; --glow-a:#3a1d22; --glow-b:#0f3433; --glow-c:#241c46;
  --surface:rgba(23,26,43,.78); --solid:#171a2b; --hover:rgba(255,255,255,.06);
  --line:#262a40; --line2:#1d2135; --fg:#eef0fa; --muted:#9ba1bf;
  --accent:#ff7452; --accent-2:#ffab5c; --accent-fg:#1a0b05; --accent-soft:#3a2018; --now:#ff7452; --danger:#ff6b6e; --ok:#3ddc97; --ok-soft:#123528;
  --gcal-line:#8f9bff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -6px rgba(0,0,0,.5); --shadow-lg:0 24px 60px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0e19; --glow-a:#3a1d22; --glow-b:#0f3433; --glow-c:#241c46;
  --surface:rgba(23,26,43,.78); --solid:#171a2b; --hover:rgba(255,255,255,.06);
  --line:#262a40; --line2:#1d2135; --fg:#eef0fa; --muted:#9ba1bf;
  --accent:#ff7452; --accent-2:#ffab5c; --accent-fg:#1a0b05; --accent-soft:#3a2018; --now:#ff7452; --danger:#ff6b6e; --ok:#3ddc97; --ok-soft:#123528;
  --gcal-line:#8f9bff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -6px rgba(0,0,0,.5); --shadow-lg:0 24px 60px -12px rgba(0,0,0,.7); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;overflow:hidden;
  background-image:radial-gradient(60vw 50vh at 0% 0%,var(--glow-a),transparent 70%),radial-gradient(50vw 45vh at 100% 0%,var(--glow-b),transparent 70%),radial-gradient(60vw 50vh at 60% 110%,var(--glow-c),transparent 70%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr;gap:12px;padding-block:12px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-sizing:border-box}
.glass{background:var(--surface);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-family:var(--display);font-size:19px;font-weight:800;margin:0;white-space:nowrap;letter-spacing:-.02em}
.brand .trip-name{display:none}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:20px;height:20px}
.btn{height:36px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--solid);font-weight:600;color:var(--fg)}
.btn:hover{background:var(--hover)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.trip-head{display:flex;align-items:center;gap:6px;min-width:0;padding-left:12px;border-left:1px solid var(--line)}
.range-label{font-family:var(--display);font-size:20px;font-weight:700;white-space:nowrap;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.range-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.progress .bar{width:84px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#7be3b5);border-radius:3px}
.spacer{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--hover);gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--fg);box-shadow:0 1px 3px rgba(20,22,41,.12)}
.seg button .n{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.seg .sw{width:10px;height:10px;border-radius:3px}
.sw.planned{border:1.5px dashed var(--muted)}
.sw.confirmed{background:var(--ok)}
.menu-btn{display:none}

.notice{padding:8px 14px;border-radius:14px;background:var(--accent-soft);color:var(--fg);font-size:13px}

/* body */
.body{display:grid;grid-template-columns:284px minmax(0,1fr);gap:12px;min-height:0}
.side{overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0;padding-bottom:4px}
.side>*{flex:none}
.card{border-radius:var(--r);padding:14px}
.new-trip{height:48px;padding:0 18px 0 14px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 10px 24px -10px color-mix(in srgb,var(--accent) 80%,transparent);display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;align-self:stretch;justify-content:center}
.new-trip:hover{filter:brightness(1.06)}
.new-trip svg{width:22px;height:22px}
.side h2{font-family:var(--display);font-size:13px;font-weight:700;margin:0 0 8px;color:var(--fg);letter-spacing:.01em;text-transform:uppercase;opacity:.75}
.side .hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.5}

.trips{display:flex;flex-direction:column;gap:4px}
.trip{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2px 10px;padding:9px 8px 9px 10px;border-radius:14px;border:0;background:transparent;text-align:left;width:100%;cursor:pointer}
.trip:hover{background:var(--hover)}
.trip[aria-current="true"]{background:color-mix(in srgb,var(--trip) 14%,var(--solid));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--trip) 35%,transparent)}
.trip .dot{width:12px;height:12px;border-radius:4px;background:var(--trip)}
.trip .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.trip .dt{grid-column:2;font-size:12px;color:var(--muted)}
.trip .edit{grid-row:1/span 2;grid-column:3;opacity:0;width:32px;height:32px}
.trip:hover .edit,.trip[aria-current="true"] .edit{opacity:1}
.trip .edit svg{width:17px;height:17px}

/* mini calendar */
.mini-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mini-head span{font-weight:700}
.mini-head .icon-btn{width:30px;height:30px;border-radius:10px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:3px 0}
.mini-grid .wd{font-size:10px;color:var(--muted);padding:4px 0;font-weight:700}
.md{height:32px;border:0;background:transparent;font-size:12px;border-radius:10px;width:32px;justify-self:center;color:var(--fg);font-variant-numeric:tabular-nums;font-weight:500}
.md:hover{background:var(--hover)}
.md.out{color:var(--muted);opacity:.55}
.md.today{color:var(--accent);font-weight:800}
.md.sel{background:var(--trip);color:#fff;font-weight:700;box-shadow:0 4px 10px -4px var(--trip)}
.md.sel.today{box-shadow:0 0 0 2px var(--solid),0 0 0 4px var(--accent)}

/* calendar panel */
.gpanel{display:flex;flex-direction:column;gap:10px}
.gpanel .row{display:flex;align-items:center;gap:8px}
.gpanel .gt{font-weight:700;flex:1}
.status{font-size:12px;color:var(--muted);line-height:1.5}
.status.err{color:var(--danger)}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:11px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cal-rows{display:flex;flex-direction:column;gap:2px}
.cal-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:0 10px;padding:6px 8px;border-radius:12px;background:color-mix(in srgb,var(--calc) 8%,transparent)}
.cal-row .cdot{width:12px;height:12px;border-radius:4px;background:var(--calc)}
.cal-row .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600}
.cal-row .cs{grid-column:2;font-size:11px;color:var(--muted)}
.cal-row .cs.err{color:var(--danger)}
.cal-row .icon-btn{width:28px;height:28px;grid-row:1/span 2;grid-column:3;border-radius:8px}
.cal-row .icon-btn svg{width:16px;height:16px}
.pick{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.pick label{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;min-width:0}
.pick label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add-cal{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.add-cal input{border:1px solid var(--line);background:var(--solid);border-radius:10px;padding:8px 10px;width:100%;min-width:0;font-size:13px;box-sizing:border-box}

/* main board */
main{min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden}
.scroller{flex:1;min-height:0;overflow:auto;position:relative;overscroll-behavior:contain}
.grid{min-width:calc(var(--gutter) + var(--n) * var(--colmin))}
.row-tpl{display:grid;grid-template-columns:var(--gutter) repeat(var(--n),minmax(var(--colmin),1fr))}
.g-top{position:sticky;top:0;z-index:6;background:var(--solid);border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:7;background:var(--solid)}
.dh{display:flex;align-items:center;justify-content:center;padding:12px 6px 8px;gap:10px;flex-wrap:wrap}
.dh .dnum{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dh .meta{display:flex;flex-direction:column;gap:2px}
.dh .tripday{font-size:10px;letter-spacing:.08em;font-weight:800;text-transform:uppercase;color:var(--trip,var(--accent))}
.dh .dow{font-size:12px;color:var(--muted);font-weight:600}
.dh.today .dnum{color:var(--accent)}
.dh .add{flex-basis:100%;font-size:12px;font-weight:600;border:1px dashed var(--line);background:transparent;color:var(--muted);padding:4px 8px;border-radius:10px}
.dh .add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.allday{min-height:30px}
.allday .corner{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-weight:600}
.allday-cell{border-left:1px solid var(--line2);padding:3px 5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;border:0;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,var(--cat,var(--c-other)) 16%,var(--solid));color:color-mix(in srgb,var(--cat,var(--c-other)) 70%,var(--fg))}
.chip.planned{background:var(--solid);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cat,var(--c-other)) 55%,transparent);outline:1.5px dashed color-mix(in srgb,var(--cat,var(--c-other)) 55%,transparent);outline-offset:-1.5px;box-shadow:none}

.g-body{position:relative;background:var(--solid)}
.gutter{position:sticky;left:0;z-index:5;background:var(--solid);height:calc(24 * var(--hour))}
.gutter span{position:absolute;right:10px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums;font-weight:500}
.col{position:relative;height:calc(24 * var(--hour));border-left:1px solid var(--line2);
  background-image:linear-gradient(var(--line2) 1px,transparent 1px);background-size:100% var(--hour);touch-action:pan-x pan-y;cursor:cell;user-select:none;-webkit-user-select:none}
.col.today{background-color:color-mix(in srgb,var(--accent) 4%,transparent)}
.nowline{position:absolute;left:-1px;right:0;height:2px;background:var(--now);z-index:4;pointer-events:none;box-shadow:0 0 8px var(--now)}
.nowline::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--now)}

.ev{position:absolute;border-radius:10px;padding:5px 8px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;z-index:2;touch-action:pan-x pan-y;
  background:color-mix(in srgb,var(--cat,var(--c-other)) 15%,var(--solid));color:color-mix(in srgb,var(--cat,var(--c-other)) 60%,var(--fg));
  box-shadow:0 0 0 1.5px var(--solid),0 2px 6px -2px color-mix(in srgb,var(--cat,var(--c-other)) 40%,transparent);transition:transform .12s,box-shadow .12s}
.ev:hover{z-index:3;transform:translateY(-1px);box-shadow:0 0 0 1.5px var(--solid),0 8px 18px -6px color-mix(in srgb,var(--cat,var(--c-other)) 55%,transparent)}
.ev .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.ev .s{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;font-weight:500}
.ev .who{font-size:10px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.short{display:flex;gap:6px;align-items:baseline;padding-top:2px}
.ev.planned{background:color-mix(in srgb,var(--solid) 88%,transparent);box-shadow:0 0 0 1.5px var(--solid);
  outline:1.5px dashed color-mix(in srgb,var(--cat,var(--c-other)) 65%,transparent);outline-offset:-1.5px}
.ev.planned:hover{box-shadow:0 0 0 1.5px var(--solid),0 8px 18px -8px rgba(20,22,41,.25)}
.cdot2{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px var(--solid)}
.ok{display:inline-grid;place-items:center;flex:none;width:14px;height:14px;border-radius:50%;background:var(--ok);color:#fff}
.ok svg{width:10px;height:10px}
.ev .rz{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize;touch-action:none}
.ev .rz.top{top:0;bottom:auto}
.ev.short .rz{height:6px}
.ev .rz::after{content:'';position:absolute;left:50%;width:22px;margin-left:-11px;height:3px;border-radius:2px;background:currentColor;opacity:0;top:3px}
.ev:hover .rz::after,.ev.armed .rz::after{opacity:.35}
.ev{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ev.armed{box-shadow:0 0 0 2px var(--accent),var(--shadow-lg);z-index:20}
.plus1{font-size:.8em;font-weight:800;opacity:.75;vertical-align:super}
.ev.dragging{box-shadow:var(--shadow-lg);opacity:.95;z-index:20;transition:none;transform:none}
.tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--gcal-line) 22%,transparent);color:inherit;flex:none}
.dghost{position:absolute;left:3px;right:7px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));opacity:.85;color:#fff;font-size:12px;font-weight:700;padding:5px 8px;z-index:15;pointer-events:none;font-variant-numeric:tabular-nums}

/* empty / agenda */
.empty{margin:auto;max-width:460px;text-align:center;padding:56px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty h2{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.empty p{color:var(--muted);margin:0;line-height:1.6}
.empty svg{width:120px;height:120px}
.agenda{max-width:820px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.ag-day{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;padding:16px;border-radius:18px;background:var(--solid);border:1px solid var(--line)}
.ag-date{display:flex;flex-direction:column;gap:2px}
.ag-date .tripday{font-size:10px;letter-spacing:.08em;font-weight:800;text-transform:uppercase;color:var(--trip,var(--accent))}
.ag-date b{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ag-date span{font-size:12px;color:var(--muted);font-weight:600}
.ag-list{display:flex;flex-direction:column;gap:4px;min-width:0}
.ag-item{display:grid;grid-template-columns:12px 92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:0;background:transparent;text-align:left;width:100%}
.ag-item:hover{background:var(--hover)}
.ag-item i{width:10px;height:10px;border-radius:50%;background:var(--cat,var(--c-other))}
.ag-item.planned i{background:transparent;box-shadow:inset 0 0 0 2px var(--cat,var(--c-other))}
.ag-item .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.ag-item .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ag-item .loc{color:var(--muted);font-size:12px;font-weight:400}
.ag-none{color:var(--muted);font-size:13px;padding:6px 10px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.confirmed{background:var(--ok-soft);color:var(--ok)}
.pill.planned{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(12,14,25,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--solid);color:var(--fg);border-radius:24px;box-shadow:var(--shadow-lg);width:min(500px,100%);max-height:calc(100% - 16px);overflow:auto;padding:22px 24px 18px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;border:1px solid var(--line)}
.modal h3{margin:0;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em}

<script>
(() => {
const CAL = 'Google Calendar';
const HOUR = 48, SNAP = 15;
const CATS = {
  travel:{label:'Travel'}, stay:{label:'Stay'}, food:{label:'Food & drink'},
  activity:{label:'Activity'}, meeting:{label:'Meeting'}, other:{label:'Other'}
};
const TRIP_COLORS = ['#ff5a36','#2b7bff','#10b981','#8b5cf6','#ec4899','#ff9f1c','#06b6d4','#475569'];

const HOST = window.ITIN_HOST || null; // set only by the self-hosted build
const use = n => HOST ? Promise.resolve(HOST.use(n)) : (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const todayISO = () => iso(new Date());
const tm = s => { if(!s) return 0; const [h,m] = s.split(':').map(Number); return h*60+(m||0); };
const mt = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const dayDiff = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 864e5);
// items can run past midnight: endDay is the day the end time falls on (missing = same day)
const itemEndDay = it => it.endDay && it.endDay > it.day ? it.endDay : it.day;
const itemEndMin = it => it.end === '24:00' ? 1440 : tm(it.end);
function itemSeg(it, day){
  const ed = itemEndDay(it); if (day < it.day || day > ed) return null;
  const a = day === it.day ? tm(it.start) : 0, b = day === ed ? itemEndMin(it) : 1440;
  return { a, b: Math.max(b, a + 15), first: day === it.day, last: day === ed };
}
// minutes counted from the start of day0 (may run into later days) -> item fields
function spanFromAbs(day0, s, e){
  const sd = Math.floor(s / 1440), ed = Math.max(sd, Math.floor((e - 1) / 1440));
  return { day: addDays(day0, sd), start: mt(s - sd * 1440), endDay: ed > sd ? addDays(day0, ed) : null, end: mt(e - ed * 1440) };
}
const itemTimeTxt = it => `${it.start}–${it.end === '24:00' ? '00:00' : it.end}${itemEndDay(it) > it.day ? ` <span class="plus1">+${dayDiff(itemEndDay(it), it.day)}</span>` : ''}`;

function fmtSpan(a,b){
  const A = parseISO(a), B = parseISO(b), full = {day:'numeric',month:'short',year:'numeric'};
  if (a === b) return A.toLocaleDateString('en-GB',full);
  if (A.getFullYear()===B.getFullYear() && A.getMonth()===B.getMonth()) return `${A.getDate()}–${B.toLocaleDateString('en-GB',full)}`;
  if (A.getFullYear()===B.getFullYear()) return `${A.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${B.toLocaleDateString('en-GB',full)}`;

/* ---------- stores ---------- */
function localStore(){
  let data = null; try { data = JSON.parse(lsGet('itin-local') || 'null'); } catch {}
  data = data || {trips:{}, items:{}};
  const L = {trips:new Set(), items:new Map()};
  const save = () => lsSet('itin-local', JSON.stringify(data));
  const emitTrips = () => { const a = Object.entries(data.trips).map(([id,v]) => ({id,...v})); L.trips.forEach(f => f(a)); };
  const emitItems = t => { const a = Object.entries(data.items[t]||{}).map(([id,v]) => ({id,...v})); (L.items.get(t)||new Set()).forEach(f => f(a)); };
  return { mode:'local', newId:() => Math.random().toString(36).slice(2,10)+Date.now().toString(36),
    subTrips(cb){ L.trips.add(cb); setTimeout(emitTrips); return () => L.trips.delete(cb); },
    subItems(t,cb){ if(!L.items.has(t)) L.items.set(t,new Set()); L.items.get(t).add(cb); setTimeout(() => emitItems(t)); return () => L.items.get(t).delete(cb); },
    async setTrip(id,d){ data.trips[id]=d; save(); emitTrips(); },
    async patchTrip(id,d){ data.trips[id]={...data.trips[id],...d}; save(); emitTrips(); },
    async delTrip(id){ delete data.trips[id]; delete data.items[id]; save(); emitTrips(); },
    async setItem(t,id,d){ (data.items[t] ||= {})[id]=d; save(); emitItems(t); },
    async patchItem(t,id,d){ data.items[t][id]={...data.items[t][id],...d}; save(); emitItems(t); },
    async delItem(t,id){ if(data.items[t]) delete data.items[t][id]; save(); emitItems(t); } };
}
function dbStore(db){
  const snap = s => s.docs.map(d => ({id:d.id, ...d.data()}));
  return { mode:'db', newId:() => db.collection('trips').doc().id,
    subTrips(cb,err){ return db.collection('trips').onSnapshot(s => cb(snap(s)), err); },
    subItems(t,cb,err){ return db.collection(`trips/${t}/items`).onSnapshot(s => cb(snap(s)), err); },
    setTrip:(id,d) => db.doc(`trips/${id}`).set(d),
    patchTrip:(id,d) => db.doc(`trips/${id}`).update(d),
    async delTrip(id){ const s = await db.collection(`trips/${id}/items`).get(); for (const d of s.docs) await db.doc(`trips/${id}/items/${d.id}`).delete(); await db.doc(`trips/${id}`).delete(); },
    setItem:(t,id,d) => db.doc(`trips/${t}/items/${id}`).set(d),
    patchItem:(t,id,d) => db.doc(`trips/${t}/items/${id}`).update(d),
    delItem:(t,id) => db.doc(`trips/${t}/items/${id}`).delete() };
}
async function write(fn, okMsg){
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const c = e && e.code;
    toast(c === 'invalid_argument' ? "You can view this planner but can't change it." :
          c === 'quota_exceeded' ? 'Storage is full. Delete an old trip and try again.' :
          "Couldn't save that change. Check your connection and try again.");
    return false;
  }
}

/* ---------- trips & items ---------- */
function onTrips(arr){
  S.trips = arr.sort((a,b) => (tripDays(a)[0]||'9999').localeCompare(tripDays(b)[0]||'9999'));
  if (!curTrip()) {
    const t = todayISO();
    const pick = S.trips.find(x => (tripDays(x).at(-1)||'') >= t) || S.trips[0];
    selectTrip(pick ? pick.id : null);
  } else if (!itemsUnsub) selectTrip(S.tripId);   // first load with a remembered trip: start listening to its items
  else { syncCalendarWatch(); render(); }
  if (S.legModal) renderLegModal();
  scanMail();
}
function selectTrip(id){
  S.tripId = id; if (id) lsSet('itin-trip', id);
  if (itemsUnsub) itemsUnsub(); itemsUnsub = null; S.items = [];
  let firstSnap = true;
  if (id && store) itemsUnsub = store.subItems(id, arr => { S.items = arr; if (firstSnap) { S.needScroll = true; firstSnap = false; } renderView(); renderSide(); if (S.legModal) renderLegModal(); }, () => toast("Lost the live connection to this trip. Reload to reconnect."));
  S.start = 0; S.needScroll = true;
  const d = tripDays(curTrip());
  const ref = d[0] ? parseISO(d[0]) : new Date();
  S.month = new Date(ref.getFullYear(), ref.getMonth(), 1);
  syncCalendarWatch(); render(); scanMail();
}

/* ---------- bookings found in email (self-hosted build only) ---------- */
const MAIL = { state:'idle', list:[], accounts:[], key:'', err:'' };
async function scanMail(refresh){
  if (!HOST || !HOST.mailScan) return;
  const t = curTrip(), days = tripDays(t), key = (S.tripId || '') + '|' + days.join(',');
  if (!t || !days.length) { MAIL.key = key; MAIL.state = 'idle'; MAIL.list = []; renderMail(); return; }
  if (!refresh && key === MAIL.key && MAIL.state !== 'error') return;
  MAIL.key = key; MAIL.state = 'loading'; renderMail();
  try { const r = await HOST.mailScan(days, !!refresh); if (MAIL.key !== key) return; MAIL.list = r.bookings || []; MAIL.accounts = r.accounts || []; MAIL.state = 'ok'; }
  catch (e) { if (MAIL.key !== key) return; MAIL.state = 'error'; MAIL.err = (e && e.message) || 'Couldn\'t search email just now.'; }
  renderMail();
}
function mailVisible(){
  const t = curTrip() || {}, dismissed = new Set(t.mailDismissed || []);
  const added = new Set(S.items.flatMap(i => i.mailIds || []));
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  return MAIL.list.filter(b => {
    if ((b.ids || [b.id]).some(id => dismissed.has(id) || added.has(id))) return false;
    const words = norm(b.title).split(' ').filter(w => w.length > 2);
    const same = x => { const n = ' ' + norm(x) + ' '; return words.length > 0 && words.every(w => n.includes(' ' + w + ' ')); };
    if (S.items.some(i => i.day === b.date && same(i.title))) return false;
    if (S.calEvents.some(e => !e.hidden && (e.allDay ? (e.startDay <= b.date && b.date < e.endDay) : iso(e.s) === b.date) && same(e.title))) return false;
    return true;
  });
}

    <div class="status ${MAIL.state === 'error' ? 'err' : ''}">${status}</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${vis.map((b, i) => `<div style="border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:var(--solid)">
        <div style="font-weight:700;display:flex;gap:6px;align-items:center">${CHECK}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.title)}</span></div>
        <div class="status">${esc(shortDay(b.date))} · ${b.start ? esc(b.start) : 'time not found'}${b.location ? ' · ' + esc(b.location) : ''}</div>
        ${b.ref ? `<div class="status" style="font-family:var(--mono)">${esc(b.ref)}</div>` : ''}
        <div class="status" title="${esc(b.subject)}">In ${esc((b.accounts || [b.account]).map(a => a.split('@')[0]).join(', '))}'s inbox · <a href="${esc(b.link)}" target="_blank" rel="noopener" style="color:inherit">open email</a></div>
        <div style="display:flex;gap:6px;margin-top:4px"><button class="btn primary" style="height:30px;padding:0 12px" data-mail-add="${i}">Add to plan</button><button class="btn" style="height:30px;padding:0 12px" data-mail-dismiss="${i}">Dismiss</button></div></div>`).join('')}</div>
    ${off.length ? `<p class="hint">Email search isn't allowed for ${esc(off.map(a => a.email).join(', '))}. <button class="btn ghost" style="height:26px;padding:0 6px" id="mailAllow">Allow in Settings</button></p>` : ''}

/* ---------- Google Calendar ---------- */
const WRITABLE = ['owner','writer'];
function rangeInput(id, days){ return { calendarId:id, startTime: days[0] + 'T00:00:00', endTime: addDays(days.at(-1),1) + 'T00:00:00', pageSize:250, orderBy:'startTime' }; }
function syncCalendarWatch(){
  const t = curTrip(), days = tripDays(t);
  const cals = (S.showCal && mcp && days.length) ? tripCals(t) : [];
  const range = days.length ? days[0] + '|' + days.at(-1) : '';
  const want = new Map(cals.map(c => [c.id + '|' + range, c]));
  for (const [k, w] of calWatches) if (!want.has(k)) { w.unsub && w.unsub(); calWatches.delete(k); S.calData.delete(w.id); }
  for (const [k, c] of want) if (!calWatches.has(k)) {
    const w = { id:c.id, input: rangeInput(c.id, days), unsub:null };
    calWatches.set(k, w);
    S.calData.set(c.id, { state:'loading', events:[] });
    w.unsub = mcp.watchTool(CAL, 'list_events', w.input, ev => {
      if (calWatches.get(k) !== w) return;
      if (ev.type === 'data') applyCal(c.id, ev.result); else calError(c.id, ev.error);
    }, { refetchInterval: 5*60*1000, cache:{ staleTime: 60*1000, gcTime: 60*60*1000 } });
  }
  rebuildCalEvents(); renderGPanel(); renderView();
}
const normTitle = s => String(s || '').toLowerCase().replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
function rebuildCalEvents(){
  const tc = tripCals(curTrip()), primaryKey = (S.primaryId || '').toLowerCase();
  const calFor = email => email && tc.find(c => c.id.toLowerCase() === email || (c.id === 'primary' && email === primaryKey));
  const all = [...S.calData].flatMap(([id, d]) => d.events.map(e => {
    const owner = calFor(e.organizer);
    return { ...e, calId:id, key: id + '/' + e.id, showCal: owner ? owner.id : id,
      editable: WRITABLE.includes(d.access) && (e.organizerSelf || e.guestsCanModify || !e.organizer) };
  }));
  // the same booking often appears twice (your Gmail copy + an invite from someone else): keep one, preferring an editable copy
  const seen = new Map();
  for (const e of all) {
    const sig = normTitle(e.title) + '|' + (e.allDay ? e.startDay : +e.s);
    const prev = seen.get(sig);
    const better = prev && ((e.editable && !prev.editable) || (e.editable === prev.editable && !e.fromGmail && prev.fromGmail));
    if (!prev) seen.set(sig, e);
    else if (better) seen.set(sig, {...e, fromGmail: e.fromGmail || prev.fromGmail, showCal: prev.showCal !== prev.calId ? prev.showCal : e.showCal});
    else if (e.fromGmail && !prev.fromGmail) seen.set(sig, {...prev, fromGmail: true});
  }
  const meta = (curTrip() || {}).gmeta || {};
  S.calEvents = [...seen.values()].map(e => {
    const m = meta[gKey(e)]; if (!m) return e;
    const o = {...e};
    if (m.title != null) o.title = m.title;
    if (m.location != null) o.location = m.location;
    if (m.notes != null) o.desc = m.notes;
    if (m.allDay === true && m.startDay) { o.allDay = true; o.startDay = m.startDay; o.endDay = m.endDay || addDays(m.startDay,1); }
    else if (m.start && m.end) { const s2 = new Date(m.start), e2 = new Date(m.end); if (!isNaN(s2) && !isNaN(e2)) { o.allDay = false; o.s = s2; o.e = e2; } }
    o.adjusted = ['title','location','notes','start','startDay'].some(k => m[k] != null);
    o.hidden = !!m.hidden;
    return o;
  });
}
function mapCal(e){
  if (!e || e.status === 'cancelled') return null;
  const base = { id:e.id, title:e.summary || '(No title)', location:e.location || '', link:e.htmlLink || '',
    organizer: ((e.organizer && e.organizer.email) || '').toLowerCase(), organizerSelf: !!(e.organizer && e.organizer.self),
    guestsCanModify: !!(e.guestPermissions && e.guestPermissions.guestsCanModify),
    fromGmail: e.eventType === 'FROM_GMAIL', recurring: !!e.recurringEventId, guests: Array.isArray(e.attendees) && e.attendees.length > 1,
    desc: stripHtml(e.description).trim().slice(0,2000) };
  if (e.start && e.start.date) { const sd = String(e.start.date).slice(0,10), ed = e.end && e.end.date ? String(e.end.date).slice(0,10) : addDays(sd,1);
    return {...base, allDay:true, startDay:sd, endDay: ed > sd ? ed : addDays(sd,1)}; }
  const s = new Date(e.start && e.start.dateTime), en = new Date((e.end && e.end.dateTime) || (e.start && e.start.dateTime));
  if (isNaN(s)) return null;
  return {...base, allDay:false, s, e: isNaN(en) ? new Date(+s + 3600000) : en};
}
function applyCal(id, result){
  const p = result && result.payload;
  const list = (p && Array.isArray(p.events)) ? p.events : [];
  if (id === 'primary' && p && typeof p.summary === 'string' && p.summary.includes('@')) S.primaryId = p.summary;
  S.calData.set(id, { state:'ok', events: list.map(mapCal).filter(Boolean), access: p && p.accessRole,
    storedAt: (result.cache && result.cache.storedAt) || Date.now(), more: !!(p && p.nextPageToken) });
  rebuildCalEvents(); renderGPanel(); renderView();
  if (!S.calList && S.calListState === 'idle') loadCalList();
}
const CAL_MSG = {
  needs_reauth: 'Your Google Calendar sign-in has expired. Reconnect it in claude.ai Settings → Connectors.',
  server_not_connected: 'Google Calendar isn\'t connected. Add it in claude.ai Settings → Connectors.',
  selection_required: 'You have more than one Google Calendar connector. Pick one when claude.ai asks.',
  approval_required: 'Needs your OK to read Google Calendar.',
  not_in_manifest: 'Google Calendar is switched off for this planner.',
  blocked_by_policy: 'Your organisation blocks this calendar tool.',
  not_granted: 'Calendar access isn\'t available in this view.',
  capability_disabled: 'Calendar access isn\'t available in this view.',
  capability_removed: 'Calendar access isn\'t available in this view.'
};
if (HOST && HOST.msgs) Object.assign(CAL_MSG, HOST.msgs);
function calError(id, err){
  const code = (err && err.code) || 'upstream_error';
  const transient = ['server_unavailable','upstream_error','rate_limited','cancelled'].includes(code) || !(code in CAL_MSG || code === 'tool_error');
  const prev = S.calData.get(id) || {events:[]};
  S.calData.set(id, { state:'error', code, transient, access: prev.access, events: transient ? prev.events : [],
    msg: code === 'tool_error' ? (id === 'primary' ? 'Google Calendar returned an error.' : 'Can\'t read this calendar. Its owner needs to share it with you in Google Calendar.') :
         transient ? 'Couldn\'t reach Google Calendar just now.' : CAL_MSG[code] });
  rebuildCalEvents(); renderGPanel(); renderView();
}
async function refreshCal(){
  if (!mcp) return;
  for (const [id, d] of S.calData) S.calData.set(id, {...d, state:'loading'});
  renderGPanel();
  try { await mcp.invalidate(CAL, 'list_events'); } catch {}
  setTimeout(() => { for (const [id, d] of S.calData) if (d.state === 'loading' && d.storedAt) S.calData.set(id, {...d, state:'ok'}); renderGPanel(); }, 8000);
}
async function allowCal(){
  for (const w of calWatches.values()) {
    const d = S.calData.get(w.id); if (!d || d.state !== 'error' || d.code !== 'approval_required') continue;
    S.calData.set(w.id, {...d, state:'loading'}); renderGPanel();
    try { applyCal(w.id, await mcp.callTool(CAL, 'list_events', w.input)); } catch (e) { calError(w.id, e); }
  }
}
async function loadCalList(){
  if (!mcp) return;
  S.calListState = 'loading'; renderGPanel();
  try {
    const r = await mcp.callTool(CAL, 'list_calendars', {}, { cache:{ staleTime: 10*60*1000, gcTime: 60*60*1000 } });
    S.calList = (r.payload && Array.isArray(r.payload.calendars)) ? r.payload.calendars : [];
    S.calListState = 'ok';
  } catch (e) { S.calListState = 'error'; S.calListCode = e && e.code; }

}
function setTripCals(list){
  const t = curTrip(); if (!t) return;
  write(() => store.patchTrip(t.id, { calendars: list }));
}
function addTripCal(id, label){
  const t = curTrip(); if (!t) { toast('Create a trip first.'); return; }
  const cur = tripCals(t);
  if (cur.some(c => c.id === id) || (id === S.primaryId && cur.some(c => c.id === 'primary'))) { toast('That calendar is already on this trip.'); return; }
  const used = new Set(cur.map(c => c.color));
  const color = CAL_COLORS.find(c => !used.has(c)) || CAL_COLORS[cur.length % CAL_COLORS.length];

/* calendar writes (always from a click) */
function gcalErrText(e){
  const c = e && e.code;
  if (c === 'approval_required') return 'Google Calendar needs your OK to make changes. Allow it when claude.ai asks, then try again.';
  if (c === 'tool_error') return 'Google Calendar refused the change' + (e.message && e.message.length < 200 ? ': ' + e.message : '. You may not have edit access to this calendar.');
  if (c === 'server_unavailable' || c === 'upstream_error' || c === 'cancelled') return 'Google didn\'t confirm the change. Refreshing to check whether it went through.';
  return CAL_MSG[c] || 'Couldn\'t update Google Calendar.';
}
async function gcalWrite(tool, input, okMsg){
  try { await mcp.callTool(CAL, tool, input, { cache:false }); toast(okMsg); mcp.invalidate(CAL, 'list_events').catch(() => {}); return { ok:true }; }
  catch (e) { if (['server_unavailable','upstream_error','cancelled'].includes(e && e.code)) mcp.invalidate(CAL, 'list_events').catch(() => {}); return { ok:false, msg: gcalErrText(e) }; }
}
const writableCals = () => tripCals(curTrip()).filter(c => WRITABLE.includes((S.calData.get(c.id) || {}).access));

/* ---------- render: shell ---------- */
function render(){ renderHeader(); renderSide(); renderView(); }

function visibleDays(){
  const days = tripDays(curTrip());
  if (S.view === 'agenda' || S.view === 'all' || S.view === 'map') return days;
  const size = Math.min(Number(S.view) || 1, days.length || 1);
  S.start = Math.max(0, Math.min(S.start, Math.max(0, days.length - size)));
  return days.slice(S.start, S.start + size);
}
function renderHeader(){

}

    <div class="field"><label for="gDesc">${mode === 'local' ? 'Notes' : 'Description'}</label><textarea id="gDesc">${esc(o.desc)}</textarea></div>
    ${mode === 'google' && ev.guests ? '<label class="check"><input type="checkbox" id="gNotify"> Email guests about changes</label>' : ''}
    ${note}
    <div class="err-msg" id="gErr" hidden></div>
    <div class="foot">${mode === 'google' ? '<button class="btn danger" id="gDel">Delete</button>' : `<button class="btn" id="gHide">Hide</button>${ev.adjusted ? '<button class="btn" id="gReset">Reset</button>' : ''}`}${openLink}<span class="spacer"></span>
      <button class="btn" id="gCopy" title="Copy into this trip's itinerary">Add to itinerary</button>
      <button class="btn" id="gCancel">Cancel</button><button class="btn primary" id="gSave">Save</button></div>`, m => {

    const busy = on => m.querySelectorAll('button').forEach(b => b.disabled = on);
    const showErr = t => { err.textContent = t; err.hidden = false; busy(false); };
    const notify = () => ($m('#gNotify') && $m('#gNotify').checked) ? 'ALL' : 'NONE';
    $m('#gCancel').onclick = closeModal;

    if ($m('#gReset')) $m('#gReset').onclick = () => { closeModal(); setEvMeta(ev, {title:null, location:null, notes:null, start:null, end:null, allDay:null, startDay:null, endDay:null}, 'Back to the calendar version'); };
    if ($m('#gDel')) confirmButton($m('#gDel'), 'Delete from Google Calendar', async () => {

      const r = await gcalWrite('update_event', input, 'Saved to Google Calendar');

}

const yToMin = (col, y) => { const r = col.getBoundingClientRect(); return Math.max(0, Math.min(1440, (y - r.top) / HOUR * 60)); };
const snap = m => Math.round(m / SNAP) * SNAP;

scroller.addEventListener('pointerdown', e => {

  const rz = e.target.dataset.rz, type = rz === 'top' ? 'top' : rz ? 'resize' : 'move';

  if (gEl) {

    base = { it, s: dayDiff(it.day, day0) * 1440 + tm(it.start), e: dayDiff(itemEndDay(it), day0) * 1440 + itemEndMin(it) };
  }

    drag = { ...base, type, el, day0, x0:e.clientX, y0:e.clientY, moved:false, pointer:e.pointerType, grab: yToMin(col, e.clientY) - base.s, dur: base.e - base.s,
             elTop: parseFloat(el.style.top) / HOUR * 60, armed: e.pointerType !== 'touch' };
    if (e.pointerType === 'touch') {   // hold to pick up on touch screens, so a normal swipe still scrolls
      drag.timer = setTimeout(() => { if (!drag || drag.el !== el) return; drag.armed = true; el.classList.add('armed'); try { navigator.vibrate && navigator.vibrate(12); } catch {} }, 380);
    }
  } else {
    const a = snap(Math.floor(yToMin(col, e.clientY) / SNAP) * SNAP);
    drag = { type:'create', col, a0:a, a, b:a + 60, x0:e.clientX, y0:e.clientY, moved:false, pointer:e.pointerType, armed: e.pointerType !== 'touch' };

function pointerAbs(e, fallbackCol){
  const under = document.elementFromPoint(e.clientX, e.clientY);

  return { col, m: dayDiff(col.dataset.col, drag.day0) * 1440 + yToMin(col, e.clientY) };
}
const mod1440 = x => ((x % 1440) + 1440) % 1440;
const clockTxt = (s, e) => `${mt(mod1440(s))}–${mt(mod1440(e))}${Math.floor((e - 1) / 1440) > Math.floor(s / 1440) ? ' +1' : ''}`;
scroller.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.pointer === 'touch' && !drag.armed) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) { clearTimeout(drag.timer); drag = null; }
    return;
  }
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 5) return;
  if (!drag.moved) { drag.moved = true; S.dragging = true; if (drag.el) drag.el.classList.add('dragging'); }
  e.preventDefault();
  if (drag.type === 'create') {
    const m = snap(yToMin(drag.col, e.clientY));
    drag.a = Math.min(drag.a0, m); drag.b = Math.max(drag.a0 + SNAP, m);
    if (!drag.ghost) { drag.ghost = document.createElement('div'); drag.ghost.className = 'dghost'; drag.col.appendChild(drag.ghost); }
    drag.ghost.style.top = drag.a/60*HOUR + 'px'; drag.ghost.style.height = Math.max((drag.b-drag.a)/60*HOUR - 2, 14) + 'px';
    drag.ghost.textContent = `${mt(drag.a)}–${mt(drag.b)}`;
    return;
  }
  const el = drag.el, elCol = el.parentElement, elOff = dayDiff(elCol.dataset.col, drag.day0) * 1440;

  if (d.moved) S.suppressClick = Date.now();

    $m('#pSave').onclick = async () => {
      const name = $m('#pName').value.trim(), err = $m('#pErr');
      if (!name) { err.textContent = 'Give the place a name.'; err.hidden = false; return; }
      if (!pos) { err.textContent = 'Search for the address and pick a result, so it can go on the map.'; err.hidden = false; return; }
      const pr = $m('#pPrice').value;
      let link = $m('#pLink').value.trim(); if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
      const rec = { name, category:(m.querySelector('input[name=pCat]:checked') || {}).value || 'other', address:$m('#pAddr').value.trim(), area, lat:pos.lat, lng:pos.lng,
        price: pr === '' ? null : +pr, link, notes:$m('#pNotes').value.trim(), created: p.created || new Date().toISOString() };
      closeModal();
      await write(() => store.setPlace(isNew ? store.newId() : p.id, rec), isNew ? 'Place saved' : 'Place updated');
    };
  });
}
// address search box with suggestions (used by places and itinerary items)
function attachGeoSearch(input, box, onPick, onEdit){
  if (!GEO || !input || !box) return;
  let t = null, results = [];
  input.addEventListener('input', () => {
    onEdit && onEdit();
    clearTimeout(t); const q = input.value.trim();
    if (q.length < 3) { box.hidden = true; return; }
    t = setTimeout(async () => {
      const dest = (curTrip() || {}).destination || '';
      const pcLike = /\b[A-Z]{1,2}\d[A-Z\d]?(\s*\d[A-Z]{0,2})?\s*$/i.test(q) || /\b[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}\b/i.test(q);   // postcodes are searched as typed
      try { results = await GEO.search(q + (dest && !pcLike && !q.toLowerCase().includes(dest.toLowerCase()) ? ', ' + dest : ''), 6);
        if (!results.length && dest) results = await GEO.search(q, 6); } catch { results = []; }
      box.innerHTML = results.length ? results.map((r, i) => `<button type="button" data-gi="${i}"><b>${esc(r.name)}</b><span>${esc(r.address.split(',').slice(1, 4).join(','))}${r.precision === 'postcode' ? ' · postcode' : r.precision === 'area' ? ' · postcode area' : ''}</span></button>`).join('')
        : '<div class="status" style="padding:8px">No matches. Try adding the town or postcode.</div>';
      box.hidden = false;
    }, 500);
  });
  box.addEventListener('click', e => { const b = e.target.closest('[data-gi]'); if (!b) return; box.hidden = true; onPick(results[+b.dataset.gi]); });
  input.addEventListener('blur', () => setTimeout(() => { box.hidden = true; }, 250));
}
function importPlacesFile(file){
  file.text().then(txt => {
    let data; try { data = JSON.parse(txt); } catch { throw new Error('That file isn\'t a places backup.'); }
    if (!Array.isArray(data)) data = data.places || data.items || [];
    if (!Array.isArray(data) || !data.length) throw new Error('No places found in that file.');
    return store.importPlaces(data);
  }).then(r => toast(`Imported ${r.imported} place${r.imported === 1 ? '' : 's'}`)).catch(e => toast(e.message || 'Import failed'));
}

/* ---------- map view (clean CARTO Voyager basemap, as in Things To Do) ---------- */
let LMAP = null, mapLayers = null, mapTiles = null;
S.mapDay = null; S.showPlaces = lsGet('itin-showplaces') !== '0';
const MODE_COL = { foot:'#4f8cff', car:'#475569', bike:'#0f9d58', tube:'#dc241f' };
async function tileLayer(){
  let key = ''; try { key = (await GEO.config()).cartoKey || ''; } catch {}
  const attribution = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>';
  return key
    ? L.tileLayer(`https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(key)}`, { maxZoom:20, attribution })
    : (toast('Add a free CARTO key in Settings → Map for the clean map style'), L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap contributors' }));
}
function renderMapView(days){
  if (!GEO || !window.L) { scroller.innerHTML = emptyHTML('Map unavailable', 'The map needs the self-hosted planner with an internet connection.', ''); return; }
  if (!days.includes(S.mapDay)) S.mapDay = visibleDays()[0] || days[0];
  if (!$('#tripMap')) {
    scroller.innerHTML = `<div class="mapview"><div class="map-side" id="mapSide"></div><div id="tripMap" aria-label="Map of the day's stops"></div></div>`;
    if (LMAP) { LMAP.remove(); LMAP = null; }
    LMAP = L.map('tripMap', { zoomControl:false }).setView([51.5074, -0.1278], 12);
    L.control.zoom({ position:'bottomright' }).addTo(LMAP);
    L.control.scale({ imperial:true, metric:false, position:'bottomleft' }).addTo(LMAP);
    mapLayers = L.layerGroup().addTo(LMAP);
    tileLayer().then(l => { mapTiles = l.addTo(LMAP); });
    LMAP.on('popupopen', e => {
      const b = e.popup.getElement().querySelector('[data-map-add]');
      if (b) b.onclick = () => { const p = placeById(b.dataset.mapAdd); LMAP.closePopup(); if (p) addPlaceToPlan(p); };
    });
    S.mapFit = true;
  }
  renderMapPanel();
}
function pinHTML(color, label, hollow){
  return `<div class="mpin${hollow ? ' hollow' : ''}" style="--pc:${color}"><svg viewBox="0 0 28 40"><path d="M14 1C6.8 1 1 6.7 1 13.9 1 23.6 14 39 14 39s13-15.4 13-25.1C27 6.7 21.2 1 14 1z"/></svg><span>${label}</span></div>`;
}
// A, B, C… for the day's stops; the hotel the day starts from is marked H with a bed
function pinLabel(s){
  if (s.hotel) return '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-label="Hotel"><path d="M7 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9a4 4 0 0 0-4-4z"/></svg>';
  const list = S._lettered || [];
  const i = list.indexOf(s); return i >= 0 ? String.fromCharCode(65 + i) : '';
}
function renderMapPanel(){
  if (!LMAP || !$('#mapSide')) return;
  const t = curTrip(), days = tripDays(t), day = S.mapDay, mode = tripMode();
  const stops = dayStops(day), placed = stops.filter(hasXY), legs = dayLegs(day, stops);
  S._lettered = placed.filter(s => !s.hotel);
  const legAfter = new Map(legs.map(l => [l.A, l]));
  const tot = legs.reduce((s, l) => s + (l.leg && l.leg.duration ? l.leg.duration : 0), 0);
  $('#mapSide').innerHTML = `<div class="map-days">${days.map((d, i) => `<button data-mday="${d}" aria-pressed="${d === day}">Day ${i + 1}<span>${esc(shortDay(d))}</span></button>`).join('')}</div>
    <div class="status" style="margin-bottom:-4px">Trip default transport</div>
    <div class="seg" style="align-self:flex-start">${Object.entries(MODES).map(([k, m]) => `<button data-mmode="${k}" aria-pressed="${k === mode}">${ICON[k]} ${m.label}</button>`).join('')}</div>
    <div class="status">${placed.length < 2 ? 'Add at least two stops with a location to plan the day\'s route.' : `${fmtMins(tot)} travelling in total. Tap a leg to change how you get there.`}</div>
    <ol class="map-stops">${stops.map(s => {
      const n = placed.indexOf(s), l = legAfter.get(s), lateBy = l ? legLate(l) : 0, late = lateBy > 0;
      return `<li><span class="mnum" style="--pc:var(--c-${CATS[s.cat] ? s.cat : 'other'})">${n >= 0 ? pinLabel(s) : '–'}</span>
        <div><b>${esc(s.title)}</b><div class="status">${s.hotel ? 'Where the day starts' : s.x.kind === 'item' ? itemTimeTxt(s.x.it) : `${mt(s.a)}–${mt(Math.min(s.b, 1440))}`}${n < 0 ? ' · no location, not on the route' : ''}</div></div></li>
        ${l ? `<li class="mleg${late ? ' late' : ''}"><button data-leg="${esc(l.key)}" data-legday="${day}" title="Change transport">${ICON[l.mode]}${legDots(l)}
          <span>${esc(legSummary(l))}${late ? ` · <b class="late-t">⚠ ${lateTxt(lateBy)}</b>` : ''}</span><span class="chg">Change</span></button></li>` : ''}`; }).join('') || '<li class="status">Nothing planned on this day yet.</li>'}</ol>
    ${restoreBtn(day, legs)}
    <label class="check"><input type="checkbox" id="mapPlaces" ${S.showPlaces ? 'checked' : ''}> Show your places on the map</label>`;
  mapLayers.clearLayers();
  const bounds = [];
  // route legs, each drawn the way you travel it
  legs.forEach(l => {
    const A = [l.A.lat, l.A.lng], B = [l.B.lat, l.B.lng], open = () => openLegModal(l.day, l.key);
    const halo = legLate(l) > 0 ? { color:'#ef4444', weight:13, opacity:.45, interactive:false, className:'late-glow' } : { color:'#fff', weight:9, opacity:.9, interactive:false };
    if (l.mode === 'transit' && l.leg && l.leg.transit) {
      l.leg.transit.legs.forEach(x => {
        const pts = x.geo ? decodePolyline(x.geo.p, x.geo.prec) : [[x.from.lat, x.from.lng], [x.to.lat, x.to.lng]];
        if (x.mode === 'WALK') { L.polyline(pts, { color:'#64748b', weight:3, dashArray:'2 7', lineCap:'round' }).on('click', open).addTo(mapLayers); return; }
        const c = x.color ? '#' + x.color : '#475569';
        L.polyline(pts, halo).addTo(mapLayers);
        L.polyline(pts, { color:c, weight:5 }).bindTooltip(esc(`${modeName(x.mode)} ${x.line}${x.headsign ? ' to ' + x.headsign : ''}`)).on('click', open).addTo(mapLayers);
        [x.from, x.to].forEach(st => L.circleMarker([st.lat, st.lng], { radius:5, color:c, weight:2, fillColor:'#fff', fillOpacity:1 }).bindTooltip(esc(st.name)).addTo(mapLayers));
      });
    } else if (l.mode === 'tube' && l.leg && l.leg.tube) {
      const o = l.leg.tube, St = TUBE.stations; let at = A;
      o.legs.forEach((x, xi) => {
        if (x.type === 'walk') {
          const next = x.to ? (() => { const r = o.legs[xi + 1]; return r && r.type === 'ride' ? [St[r.stops[0]].lat, St[r.stops[0]].lng] : at; })() : B;
          L.polyline([at, next], { color:'#64748b', weight:3, dashArray:'2 7', lineCap:'round' }).on('click', open).addTo(mapLayers); at = next;
        } else {
          const pts = x.stops.map(id => [St[id].lat, St[id].lng]), c = TUBE_LINES[x.line].c;
          L.polyline(pts, halo).addTo(mapLayers);
          L.polyline(pts, { color:c, weight:5 }).bindTooltip(TUBE_LINES[x.line].name + ' line').on('click', open).addTo(mapLayers);
          x.stops.forEach((id, si) => { const end = !si || si === x.stops.length - 1;
            const cm = L.circleMarker([St[id].lat, St[id].lng], { radius:end ? 5 : 3, color:c, weight:2, fillColor:'#fff', fillOpacity:1 }).addTo(mapLayers);
            if (end) cm.bindTooltip(esc(St[id].n)); });
          at = pts[pts.length - 1];
        }
      });
    } else if (l.leg && l.leg.geometry) {
      L.geoJSON(l.leg.geometry, { style:halo, interactive:false }).addTo(mapLayers);
      L.geoJSON(l.leg.geometry, { style:{ color:MODE_COL[l.mode], weight:5, opacity:1, dashArray:l.mode === 'foot' ? '1 9' : null, lineCap:'round' } }).on('click', open).addTo(mapLayers);
    } else {
      if (halo.className) L.polyline([A, B], halo).addTo(mapLayers);
      L.polyline([A, B], { color:'#94a3b8', weight:3, dashArray:'4 8' }).on('click', open).addTo(mapLayers);
    }
  });
  // stops at (nearly) the same spot get their pins fanned out side by side so every one shows
  const groups = [];
  placed.forEach(s => { const g = groups.find(g => kmBetween(g[0], s) < 0.04); if (g) g.push(s); else groups.push([s]); });
  groups.forEach(g => g.forEach((s, i) => {
    const color = getComputedStyle(document.documentElement).getPropertyValue('--c-' + (CATS[s.cat] ? s.cat : 'other')).trim() || '#64748b';
    const dx = Math.round((i - (g.length - 1) / 2) * 26), lab = pinLabel(s);
    L.marker([s.lat, s.lng], { icon:L.divIcon({ className:'mpinw', html:pinHTML(color, lab), iconSize:[28, 40], iconAnchor:[14 - dx, 40] }), zIndexOffset:1000 + i })
      .bindTooltip(`${s.hotel ? "Hotel" : lab} · ${esc(s.title)}${s.hotel ? ' · start of the day' : ' · ' + mt(s.a)}`).addTo(mapLayers);
    bounds.push([s.lat, s.lng]);
  }));
  if (S.showPlaces) S.places.forEach(p => {
    if (!hasXY(p) || placed.some(s => Math.abs(s.lat - p.lat) < 0.0002 && Math.abs(s.lng - p.lng) < 0.0002)) return;
    L.marker([p.lat, p.lng], { icon:L.divIcon({ className:'mpinw', html:pinHTML(pcat(p).c, '', true), iconSize:[22, 32], iconAnchor:[11, 32] }) })
      .bindPopup(`<b>${esc(p.name)}</b><br><span class="status">${esc(pcat(p).label)}${p.area ? ' · ' + esc(p.area) : ''}</span><br><button class="btn primary" style="height:30px;margin-top:6px" data-map-add="${esc(p.id)}">Add to ${esc(shortDay(day))}</button>`)
      .addTo(mapLayers);
  });
  if (S.mapFit) {
    S.mapFit = false;
    const all = bounds.length ? bounds : (S.showPlaces ? S.places.filter(hasXY).map(p => [p.lat, p.lng]) : []);
    if (all.length === 1) LMAP.setView(all[0], 15); else if (all.length) LMAP.fitBounds(all, { padding:[40, 40], maxZoom:16 });
  }
  setTimeout(() => LMAP && LMAP.invalidateSize(), 50);
}

/* events for the new controls */
document.addEventListener('click', e => {
  if (e.target.closest('#plAdd')) return openPlaceModal(null);
  if (e.target.closest('#plImport')) return $('#plFile') && $('#plFile').click();
  const ed = e.target.closest('[data-pl-edit]'); if (ed) return openPlaceModal(placeById(ed.dataset.plEdit));
  const ad = e.target.closest('[data-pl-add]'); if (ad) { const p = placeById(ad.dataset.plAdd); if (p) { addPlaceToPlan(p); $('#side').classList.remove('open'); } return; }
  const rm = e.target.closest('[data-pl-remove]');
  if (rm) {
    if (!rm.dataset.armed) { rm.dataset.armed = '1'; rm.textContent = 'Confirm remove'; rm.classList.add('primary'); setTimeout(() => { if (rm.isConnected) { delete rm.dataset.armed; rm.textContent = 'Remove from plan'; rm.classList.remove('primary'); } }, 3500); return; }
    const p = placeById(rm.dataset.plRemove), ids = p ? plannedOf(p).map(i => i.id) : [];
    write(async () => { for (const id of ids) await store.delItem(S.tripId, id); }, 'Removed from the plan. It\'s still in your places.');
    return;
  }
  const lg = e.target.closest('[data-leg]'); if (lg) { e.preventDefault(); return openLegModal(lg.dataset.legday, lg.dataset.leg); }
  const lr = e.target.closest('[data-legrestore]');
  if (lr) { const t = curTrip(), rm = new Set(dayLegs(lr.dataset.legrestore).removed), legOff = Object.fromEntries(Object.entries(t.legOff || {}).filter(([k]) => !rm.has(k)));
    write(() => store.patchTrip(t.id, { legOff }), 'Travel restored'); return; }
  const md = e.target.closest('[data-mday]'); if (md) { S.mapDay = md.dataset.mday; S.mapFit = true; renderMapPanel(); return; }
  const mm = e.target.closest('[data-mmode]'); if (mm) { const t = curTrip(); if (t && t.travelMode !== mm.dataset.mmode) write(() => store.patchTrip(t.id, { travelMode: mm.dataset.mmode })); return; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'plFile' && e.target.files[0]) { importPlacesFile(e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'mapPlaces') { S.showPlaces = e.target.checked; lsSet('itin-showplaces', S.showPlaces ? '1' : '0'); renderMapPanel(); }
});
document.addEventListener('input', e => { if (e.target.id === 'plSearch') { placeQuery = e.target.value; const pos = e.target.selectionStart; renderPlaces(); const i = $('#plSearch'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } } });
if (GEO && store === null) {}  // store is set at boot

S.places = S.places || [];

/* ---------- boot ---------- */
render();
(async () => {
  const [db, m, p] = await Promise.all([use('db'), use('mcp'), use('permissions')]);
  mcp = m; perms = p;
  store = (HOST && HOST.store) || (db ? dbStore(db) : localStore());
  if (!db && !HOST) { const b = $("#notice"); b.hidden = false; b.textContent = 'Trips are saved in this browser only. Open the planner in claude.ai while signed in to keep them in your account.'; }
  S.ready = true;
  store.subTrips(onTrips, () => toast('Lost the live connection to your trips. Reload to reconnect.'));
  if (store.subPlaces) store.subPlaces(arr => { S.places = arr; renderPlaces(); if (S.view === 'map') renderMapPanel(); });
  syncCalendarWatch(); render();
})();
})();
</script>
